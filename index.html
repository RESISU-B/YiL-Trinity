<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YiL Trinity — Site Safety VR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/aframe-aabb-collider-component@3.2.0/dist/aframe-aabb-collider-component.min.js"></script>
  <script src="src/components/kinematics.js"></script>
  <script src="src/components/player-hitboxes.js"></script>
  <script src="src/components/usable.js"></script>
  <script src="src/game/tasks.js"></script>
  <script src="src/game/hazards/fall.js"></script>
  <script src="src/game/hazards/loto.js"></script>
  <script src="src/game/hazards/trench.js"></script>
</head>
<body>
  <a-scene game-manager hazard-fall hazard-loto hazard-trench
           fog="type: linear; color: #b8c6d1; near: 30; far: 110"
           shadow="type: pcfsoft">

    <a-assets timeout="15000">
      <img id="tex-dirt" src="assets/textures/dirt.jpg">
      <img id="tex-grass" src="assets/textures/grass.jpg">
      <img id="tex-concrete" src="assets/textures/concrete.jpg">
      <img id="tex-planks" src="assets/textures/planks.jpg">
      <img id="tex-metal" src="assets/textures/metal.jpg">
      <img id="tex-brick" src="assets/textures/brick.jpg">
      <img id="tex-trench" src="assets/textures/trenchwall.jpg">
      <img id="tex-facade" src="assets/textures/facade.jpg">
      <img id="tex-machine" src="assets/textures/machine.jpg">
      <img id="tex-foliage" src="assets/textures/foliage.jpg">
    </a-assets>

    <a-sky color="#9fbfdc"></a-sky>
    <a-sphere position="60 45 -80" radius="4" color="#fff7d6" material="shader: flat"></a-sphere>

    <!-- ================= GROUND (dirt site, grass surroundings, trench hole) -->
    <!-- trench footprint: x [-2,2], z [-52,-58] -->
    <a-plane class="walkable" rotation="-90 0 0" position="0 0 -11"
             width="24" height="82" material="src: #tex-dirt; repeat: 6 20" shadow="receive: true"></a-plane>
    <a-plane class="walkable" rotation="-90 0 0" position="0 0 -70"
             width="24" height="24" material="src: #tex-dirt; repeat: 6 6" shadow="receive: true"></a-plane>
    <a-plane class="walkable" rotation="-90 0 0" position="-7 0 -55"
             width="10" height="6" material="src: #tex-dirt; repeat: 3 2"></a-plane>
    <a-plane class="walkable" rotation="-90 0 0" position="7 0 -55"
             width="10" height="6" material="src: #tex-dirt; repeat: 3 2"></a-plane>
    <!-- grass beyond the site -->
    <a-plane class="walkable" rotation="-90 0 0" position="-62 -0.01 -30"
             width="100" height="140" material="src: #tex-grass; repeat: 24 32"></a-plane>
    <a-plane class="walkable" rotation="-90 0 0" position="62 -0.01 -30"
             width="100" height="140" material="src: #tex-grass; repeat: 24 32"></a-plane>
    <a-plane class="walkable" rotation="-90 0 0" position="0 -0.01 25"
             width="24" height="30" material="src: #tex-grass; repeat: 8 8"></a-plane>
    <a-plane class="walkable" rotation="-90 0 0" position="0 -0.01 -90"
             width="24" height="16" material="src: #tex-grass; repeat: 8 5"></a-plane>

    <a-entity light="type: ambient; color: #cfd8e6; intensity: 0.65"></a-entity>
    <a-entity light="type: directional; intensity: 0.9; castShadow: true;
                     shadowCameraLeft: -40; shadowCameraRight: 40;
                     shadowCameraTop: 40; shadowCameraBottom: -40"
              position="18 30 8"></a-entity>

    <!-- ================= PLAYER RIG ================ -->
    <a-entity id="rig" movement-controls="speed: 0.3; fly: false"
              simple-gravity player-hitboxes position="0 0 4">
      <a-entity id="head" camera look-controls position="0 1.6 0">
        <a-entity cursor="rayOrigin: mouse" raycaster="objects: .interactable; far: 30"></a-entity>
        <a-plane damage-flash position="0 0 -0.3" width="1" height="1"
                 material="color: red; transparent: true; opacity: 0; depthTest: false"></a-plane>
      </a-entity>
      <a-entity id="handL" hand-controls="hand: left" hand-interactor></a-entity>
      <a-entity id="handR" hand-controls="hand: right" hand-interactor></a-entity>
    </a-entity>

    <!-- ================= ZONE 1: SCAFFOLD / FALL PROTECTION (z -11..-24) ===== -->
    <a-entity id="zone-fall">
      <a-box position="1.8 1.2 -3" width="1.6" height="1" depth="0.08" color="#f4d03f"></a-box>
      <a-entity position="1.8 1.2 -2.95"
                text="value: ZONE 1\nFALL PROTECTION\nAnchor harness, cross plank; align: center; color: #222; width: 3"></a-entity>

      <!-- construction hoist ramp up the building -->
      <a-box class="walkable" position="0 3 -7.4" rotation="40 0 0"
             width="1.8" height="0.18" depth="9.6" material="src: #tex-metal; repeat: 1 5" shadow="cast: true"></a-box>

      <!-- unfinished building: body + open top floor at y=6 -->
      <a-box position="0 2.9 -14" width="4.4" height="5.8" depth="6.4"
             material="src: #tex-facade; repeat: 1 2" shadow="cast: true"></a-box>
      <a-box class="walkable" position="0 5.95 -14" width="4.4" height="0.2" depth="6.4"
             material="src: #tex-concrete; repeat: 2 3" shadow="cast: true"></a-box>
      <!-- rebar columns for the next floor -->
      <a-cylinder position="-1.9 6.7 -11.5" radius="0.05" height="1.4" color="#8d6e63"></a-cylinder>
      <a-cylinder position="1.9 6.7 -16.5" radius="0.05" height="1.4" color="#8d6e63"></a-cylinder>
      <a-cylinder position="-1.9 6.7 -16.5" radius="0.05" height="1.4" color="#8d6e63"></a-cylinder>
      <!-- guardrails: east + west only. South edge is OPEN (the hazard) -->
      <a-box position="-2.1 6.6 -14" width="0.06" height="0.06" depth="6.2" color="#e74c3c"></a-box>
      <a-box position="-2.1 7.1 -14" width="0.06" height="0.06" depth="6.2" color="#e74c3c"></a-box>
      <a-box position="2.1 6.6 -14" width="0.06" height="0.06" depth="6.2" color="#e74c3c"></a-box>
      <a-box position="2.1 7.1 -14" width="0.06" height="0.06" depth="6.2" color="#e74c3c"></a-box>

      <!-- harness anchor point -->
      <a-torus id="anchor" class="interactable" usable position="1.9 6.9 -11.6"
               radius="0.22" radius-tubular="0.05" color="#f1c40f"></a-torus>
      <a-entity position="1.9 7.5 -11.6"
                text="value: ANCHOR POINT\n(click / trigger); align: center; color: #fff; width: 2.5"></a-entity>

      <!-- the plank across the void, 6m up -->
      <a-box class="walkable" position="0 5.95 -19" width="0.5" height="0.15" depth="4.2"
             material="src: #tex-planks; repeat: 1 3" shadow="cast: true"></a-box>

      <!-- flag platform + flag -->
      <a-box class="walkable" position="0 5.95 -22.3" width="2.6" height="0.2" depth="2.6"
             material="src: #tex-planks; repeat: 1.5 1.5" shadow="cast: true"></a-box>
      <a-box position="0 2.9 -22.3" width="0.6" height="5.8" depth="0.6" material="src: #tex-concrete; repeat: 1 3"></a-box>
      <a-cylinder position="0 7 -23.2" radius="0.05" height="2" color="#666"></a-cylinder>
      <a-box position="0.35 7.6 -23.2" width="0.7" height="0.45" depth="0.03" color="#2ecc71"></a-box>

      <!-- descent ramp back to ground -->
      <a-box class="walkable" position="0 3 -27" rotation="-40 0 0"
             width="1.8" height="0.18" depth="9.6" material="src: #tex-metal; repeat: 1 5"></a-box>
    </a-entity>

    <!-- ================= ZONE 2: SUBSTATION / LOTO (z -30..-38) ============ -->
    <a-entity id="zone-loto">
      <a-box position="1.8 1.2 -29" width="1.6" height="1" depth="0.08" color="#f4d03f"></a-box>
      <a-entity position="1.8 1.2 -28.95"
                text="value: ZONE 2\nLOCKOUT / TAGOUT\nBreaker, tag, then panel; align: center; color: #222; width: 3"></a-entity>

      <!-- industrial generator: textured housing, base skid, exhaust, pipes -->
      <a-box position="-2 0.15 -33" width="2.8" height="0.3" depth="2.8" material="src: #tex-metal; repeat: 2 1"></a-box>
      <a-box position="-2 1.35 -33" width="2.2" height="2.1" depth="2.2"
             material="src: #tex-machine; repeat: 1 1" shadow="cast: true"></a-box>
      <a-box position="-2 2.5 -33" width="2.3" height="0.18" depth="2.3" material="src: #tex-metal; repeat: 2 1"></a-box>
      <a-cylinder position="-2.6 3 -33.6" radius="0.14" height="0.9" material="src: #tex-metal"></a-cylinder>
      <a-cylinder position="-2.9 1.2 -31.85" rotation="90 0 0" radius="0.09" height="2.4" material="src: #tex-metal"></a-cylinder>
      <!-- hazard stripe skirting -->
      <a-box position="-2 0.38 -31.87" width="2.3" height="0.14" depth="0.02" color="#f1c40f"></a-box>
      <a-box position="-0.87 0.38 -33" rotation="0 90 0" width="2.3" height="0.14" depth="0.02" color="#f1c40f"></a-box>
      <!-- spinning flywheel on the east face -->
      <a-entity id="gear" position="-0.82 1.45 -32.4">
        <a-torus radius="0.55" radius-tubular="0.06" rotation="0 90 0" color="#2c3e50"></a-torus>
        <a-box width="1.05" height="0.16" depth="0.07" color="#34495e"></a-box>
        <a-box width="0.16" height="1.05" depth="0.07" color="#34495e"></a-box>
        <a-cylinder rotation="90 0 0" radius="0.12" height="0.14" material="src: #tex-metal"></a-cylinder>
      </a-entity>
      <a-entity id="sparks" position="-0.8 1.4 -32.4" visible="false">
        <a-box position="0.2 0.3 0.1" width="0.08" height="0.08" depth="0.08" color="#ffee58"
               animation="property: position; to: 0.6 -0.4 0.4; dur: 300; loop: true"></a-box>
        <a-box position="-0.15 0.2 0.15" width="0.06" height="0.06" depth="0.06" color="#ffca28"
               animation="property: position; to: -0.5 -0.5 0.5; dur: 250; loop: true"></a-box>
        <a-box position="0 0.4 0.2" width="0.07" height="0.07" depth="0.07" color="#fff176"
               animation="property: position; to: 0.1 -0.6 0.6; dur: 350; loop: true"></a-box>
      </a-entity>
      <a-plane id="service-panel" class="interactable" usable rotation="0 90 0"
               position="-0.87 1 -33.9" width="1.15" height="1.15" color="#212f3c"></a-plane>
      <a-entity position="-0.8 0.4 -33.9" rotation="0 90 0"
                text="value: SERVICE PANEL; align: center; color: #fff; width: 2"></a-entity>

      <!-- breaker pole -->
      <a-cylinder position="2 1 -33" radius="0.07" height="2" material="src: #tex-metal"></a-cylinder>
      <a-box id="breaker" class="interactable" usable position="2 1.55 -33"
             width="0.5" height="0.7" depth="0.3" color="#c0392b"></a-box>
      <a-entity position="2 2.2 -32.8"
                text="value: BREAKER; align: center; color: #fff; width: 2.5"></a-entity>
      <a-cylinder id="tag-hook" class="interactable" usable position="2 0.95 -32.8"
                  rotation="90 0 0" radius="0.06" height="0.15" color="#d5d8dc"></a-cylinder>
      <a-box id="tag" visible="false" position="2 0.72 -32.75" rotation="8 0 0"
             width="0.22" height="0.34" depth="0.02" color="#e74c3c"></a-box>
      <a-entity position="2 0.55 -32.6"
                text="value: TAG HOOK; align: center; color: #fff; width: 1.8"></a-entity>

      <!-- chain-link fence look: posts + concrete kerb -->
      <a-box position="-4.5 0.25 -33" width="0.4" height="0.5" depth="6" material="src: #tex-concrete; repeat: 1 3"></a-box>
      <a-cylinder position="-4.5 1.3 -30.5" radius="0.05" height="1.6" material="src: #tex-metal"></a-cylinder>
      <a-cylinder position="-4.5 1.3 -35.5" radius="0.05" height="1.6" material="src: #tex-metal"></a-cylinder>
      <a-box position="-4.5 1.9 -33" width="0.04" height="0.04" depth="5" color="#909497"></a-box>
    </a-entity>

    <!-- ================= ZONE 3: TRENCH (z -52..-58) ======================= -->
    <a-entity id="zone-trench">
      <a-box position="1.8 1.2 -47" width="1.6" height="1" depth="0.08" color="#f4d03f"></a-box>
      <a-entity position="1.8 1.2 -46.95"
                text="value: ZONE 3\nTRENCH SAFETY\nShore it before entering; align: center; color: #222; width: 3"></a-entity>

      <a-plane class="walkable" rotation="-90 0 0" position="0 -2 -55"
               width="4" height="6" material="src: #tex-trench; repeat: 2 3"></a-plane>
      <a-box id="trench-wall-e" position="2.15 -1 -55" width="0.3" height="2" depth="6"
             material="src: #tex-trench; repeat: 3 1"></a-box>
      <a-box id="trench-wall-w" position="-2.15 -1 -55" width="0.3" height="2" depth="6"
             material="src: #tex-trench; repeat: 3 1"></a-box>
      <a-box position="0 -1 -58.15" width="4.6" height="2" depth="0.3" material="src: #tex-trench; repeat: 2 1"></a-box>
      <a-box position="-1.45 -1 -51.85" width="1.7" height="2" depth="0.3" material="src: #tex-trench"></a-box>
      <a-box position="1.45 -1 -51.85" width="1.7" height="2" depth="0.3" material="src: #tex-trench"></a-box>
      <a-box class="walkable" position="0 -1 -53.5" rotation="-33.7 0 0"
             width="1.3" height="0.15" depth="3.7" material="src: #tex-planks; repeat: 1 2"></a-box>

      <a-box class="shore" visible="false" position="1.85 -1 -53.5" width="0.12" height="1.9" depth="2.4" material="src: #tex-planks; repeat: 2 1"></a-box>
      <a-box class="shore" visible="false" position="1.85 -1 -56.5" width="0.12" height="1.9" depth="2.4" material="src: #tex-planks; repeat: 2 1"></a-box>
      <a-box class="shore" visible="false" position="-1.85 -1 -53.5" width="0.12" height="1.9" depth="2.4" material="src: #tex-planks; repeat: 2 1"></a-box>
      <a-box class="shore" visible="false" position="-1.85 -1 -56.5" width="0.12" height="1.9" depth="2.4" material="src: #tex-planks; repeat: 2 1"></a-box>
      <a-cylinder class="shore" visible="false" position="0 -0.6 -53.5" rotation="0 0 90" radius="0.07" height="3.6" material="src: #tex-metal"></a-cylinder>
      <a-cylinder class="shore" visible="false" position="0 -0.6 -56.5" rotation="0 0 90" radius="0.07" height="3.6" material="src: #tex-metal"></a-cylinder>

      <a-box id="shore-stack" class="interactable" usable position="3.4 0.35 -50"
             width="1" height="0.7" depth="2.4" material="src: #tex-planks; repeat: 2 1" shadow="cast: true"></a-box>
      <a-entity position="3.4 1.1 -49.9"
                text="value: SHORING STACK\n(use to deploy); align: center; color: #fff; width: 2.5"></a-entity>

      <a-torus id="valve" class="interactable" usable position="0 -1.2 -57.7"
               radius="0.3" radius-tubular="0.05" color="#e74c3c"></a-torus>
      <a-cylinder position="0 -1.7 -57.9" rotation="90 0 0" radius="0.12" height="1.5" material="src: #tex-metal"></a-cylinder>

      <a-box position="-3.4 0.4 -53" rotation="0 20 0" width="1.6" height="0.9" depth="2.5" material="src: #tex-dirt; repeat: 1 1"></a-box>
      <a-box position="-3.2 0.3 -56.5" rotation="0 -15 0" width="1.4" height="0.7" depth="2" material="src: #tex-dirt"></a-box>

      <!-- excavator beside the trench -->
      <a-entity position="-6.5 0 -49" rotation="0 -35 0">
        <a-box position="0 0.45 0" width="2.4" height="0.5" depth="1.6" material="src: #tex-metal; repeat: 2 1"></a-box>
        <a-box position="0 0.2 0.85" width="2.6" height="0.45" depth="0.5" color="#2c3e50"></a-box>
        <a-box position="0 0.2 -0.85" width="2.6" height="0.45" depth="0.5" color="#2c3e50"></a-box>
        <a-box position="-0.3 1.25 0" width="1.4" height="1.1" depth="1.4" color="#d4ac0d" shadow="cast: true"></a-box>
        <a-box position="-0.3 1.45 0.3" width="0.9" height="0.6" depth="0.7" color="#85929e"></a-box>
        <a-box position="1.4 1.6 0" rotation="0 0 -38" width="2.6" height="0.35" depth="0.3" color="#d4ac0d"></a-box>
        <a-box position="2.9 1.05 0" rotation="0 0 48" width="1.8" height="0.3" depth="0.28" color="#d4ac0d"></a-box>
        <a-box position="3.6 0.45 0" width="0.7" height="0.55" depth="0.7" color="#7f8c8d"></a-box>
      </a-entity>
    </a-entity>

    <!-- ================= SITE DRESSING ==================================== -->
    <a-cone position="3 0.35 -10" radius-bottom="0.28" radius-top="0.03" height="0.7" color="#e67e22"></a-cone>
    <a-cone position="-3.2 0.35 -20" radius-bottom="0.28" radius-top="0.03" height="0.7" color="#e67e22"></a-cone>
    <a-cone position="3.4 0.35 -40" radius-bottom="0.28" radius-top="0.03" height="0.7" color="#e67e22"></a-cone>
    <a-cone position="-3 0.35 -45" radius-bottom="0.28" radius-top="0.03" height="0.7" color="#e67e22"></a-cone>
    <a-cylinder position="-5 0.55 -12" radius="0.4" height="1.1" color="#2471a3"></a-cylinder>
    <a-cylinder position="-5.6 0.55 -12.6" radius="0.4" height="1.1" color="#b03a2e"></a-cylinder>
    <!-- concrete barriers along the path -->
    <a-box position="5 0.4 -18" width="0.5" height="0.8" depth="3" material="src: #tex-concrete; repeat: 2 1"></a-box>
    <a-box position="5 0.4 -35" width="0.5" height="0.8" depth="3" material="src: #tex-concrete; repeat: 2 1"></a-box>
    <a-box position="-5 0.4 -42" width="0.5" height="0.8" depth="3" material="src: #tex-concrete; repeat: 2 1"></a-box>
    <!-- pallet stack + site office container -->
    <a-box position="6 0.5 -25" rotation="0 30 0" width="1.2" height="1" depth="1.2" material="src: #tex-planks; repeat: 1 1"></a-box>
    <a-box position="8.5 1.3 -8" rotation="0 -15 0" width="6" height="2.6" depth="2.4"
           material="src: #tex-metal; repeat: 4 1" shadow="cast: true"></a-box>
    <a-box position="7.6 0.9 -6.9" rotation="0 -15 0" width="0.8" height="1.8" depth="0.06" color="#34495e"></a-box>

    <!-- tower crane -->
    <a-box position="-18 9 -45" width="1.2" height="18" depth="1.2" color="#d4ac0d" material="src: #tex-metal; repeat: 1 8"></a-box>
    <a-box position="-11 17.5 -45" width="16" height="0.8" depth="0.8" color="#d4ac0d"></a-box>
    <a-box position="-21.5 17.5 -45" width="5" height="0.8" depth="0.8" color="#d4ac0d"></a-box>
    <a-box position="-23.5 17 -45" width="1.4" height="1.4" depth="1.4" material="src: #tex-concrete"></a-box>
    <a-cylinder position="-5 14.5 -45" radius="0.03" height="6" color="#333"></a-cylinder>
    <a-box position="-5 11.2 -45" width="1.4" height="0.7" depth="1" color="#7f8c8d"></a-box>

    <!-- city buildings -->
    <a-box position="25 9 -60" width="12" height="18" depth="12" material="src: #tex-facade; repeat: 2 3"></a-box>
    <a-box position="24 5 -38" width="8" height="10" depth="8" material="src: #tex-brick; repeat: 4 5"></a-box>
    <a-box position="-30 7 -70" width="14" height="14" depth="10" material="src: #tex-facade; repeat: 2 2"></a-box>
    <a-box position="-24 4 -25" width="9" height="8" depth="9" material="src: #tex-brick; repeat: 5 4"></a-box>
    <a-box position="30 6 -15" width="10" height="12" depth="10" material="src: #tex-facade; repeat: 2 2"></a-box>

    <!-- greenery: trees around the perimeter -->
    <a-entity id="trees"></a-entity>
    <script>
      // scatter trees + bushes on the grass strips (fixed seed-ish layout)
      const treeSpots = [
        [-16, 2], [-19, -10], [-17, -30], [-20, -55], [-16, -70],
        [16, 3], [19, -12], [17, -28], [20, -48], [17, -68],
        [-14, -18], [14, -60], [-22, -40], [22, -22]
      ];
      const holder = document.querySelector('#trees');
      treeSpots.forEach(([x, z], i) => {
        const s = 0.8 + (i % 3) * 0.25;
        const t = document.createElement('a-entity');
        t.innerHTML =
          '<a-cylinder position="0 ' + (1.1 * s) + ' 0" radius="' + (0.16 * s) + '" height="' + (2.2 * s) + '" color="#6e4f2f"></a-cylinder>' +
          '<a-sphere position="0 ' + (2.6 * s) + ' 0" radius="' + (1.15 * s) + '" material="src: #tex-foliage"></a-sphere>' +
          '<a-sphere position="' + (0.55 * s) + ' ' + (2.15 * s) + ' 0.25" radius="' + (0.75 * s) + '" material="src: #tex-foliage"></a-sphere>' +
          '<a-sphere position="' + (-0.5 * s) + ' ' + (2.2 * s) + ' -0.2" radius="' + (0.7 * s) + '" material="src: #tex-foliage"></a-sphere>';
        t.setAttribute('position', x + ' 0 ' + z);
        holder.appendChild(t);
      });
      // bushes near the path edges
      [[-6, -8], [6, -14], [-6, -37], [6, -44], [-6, -60]].forEach(([x, z]) => {
        const b = document.createElement('a-sphere');
        b.setAttribute('position', x + ' 0.35 ' + z);
        b.setAttribute('radius', '0.45');
        b.setAttribute('material', 'src: #tex-foliage');
        holder.appendChild(b);
      });
    </script>
  </a-scene>
</body>
</html>
